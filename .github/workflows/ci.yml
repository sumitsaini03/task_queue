name: CI & Security

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint-and-test:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Install Static Analysis Tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Staticcheck
        run: staticcheck ./...

      - name: Run Vulnerability Check (govulncheck)
        run: govulncheck ./...

      - name: Run Security Audit (gosec)
        run: gosec -exclude=G104 ./...

      - name: Run Tests with Race Detector & Coverage
        run: |
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.txt
          fail_ci_if_error: false

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/taskqueue ./cmd/server

      - name: Build Docker Image
        run: |
          docker build -t taskqueue:ci .
